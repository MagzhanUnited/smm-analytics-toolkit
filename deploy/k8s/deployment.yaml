apiVersion: apps/v1
kind: Deployment
metadata:
  name: smmkit
  namespace: smmkit
  labels: { app: smmkit }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: smmkit }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: smmkit }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: smmkit
          image: smmkit:latest          # replaced by the pipeline with smmkit:<build>-<commit>
          imagePullPolicy: IfNotPresent # images are side-loaded into kind
          ports:
            - containerPort: 8080
          env:
            - name: SMMKIT_SALT
              valueFrom:
                secretKeyRef: { name: smmkit-salt, key: salt, optional: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
